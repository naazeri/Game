<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#141c2e"/>
      <stop offset="100%" stop-color="#070a12"/>
    </radialGradient>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-pink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-white" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect width="62" height="62" x="1" y="1" rx="13" fill="none" stroke="#22314a" stroke-width="1.5"/>

  <!-- Center dashed net -->
  <line x1="32" y1="8" x2="32" y2="56" stroke="#2b3b55" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Left Cyan Paddle (Capsule) -->
  <rect x="8" y="18" width="6" height="28" rx="3" fill="#00f0ff" filter="url(#glow-cyan)"/>
  <rect x="9.5" y="19.5" width="3" height="25" rx="1.5" fill="#ffffff" opacity="0.8"/>

  <!-- Right Magenta Paddle (Capsule) -->
  <rect x="50" y="24" width="6" height="28" rx="3" fill="#ff3366" filter="url(#glow-pink)"/>
  <rect x="51.5" y="25.5" width="3" height="25" rx="1.5" fill="#ffffff" opacity="0.8"/>

  <!-- Center Glowing Ball -->
  <circle cx="28" cy="30" r="4.5" fill="#ffffff" filter="url(#glow-white)"/>
</svg>