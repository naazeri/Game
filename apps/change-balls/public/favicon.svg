<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#161c2e"/>
      <stop offset="100%" stop-color="#0c0f17"/>
    </radialGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>
  <!-- Outer Orbit Rings -->
  <ellipse cx="32" cy="32" rx="23" ry="9" fill="none" stroke="#38bdf8" stroke-width="1.8" opacity="0.75" transform="rotate(-25 32 32)"/>
  <ellipse cx="32" cy="32" rx="23" ry="9" fill="none" stroke="#94a3b8" stroke-width="1.8" opacity="0.75" transform="rotate(35 32 32)"/>
  <!-- Central Ball Pair: White Top, Black Bottom -->
  <circle cx="32" cy="22" r="8.5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <circle cx="32" cy="42" r="8.5" fill="#090d16" stroke="url(#silverGrad)" stroke-width="2.2"/>
  <!-- Orbiting Electron Sparks -->
  <circle cx="15" cy="24" r="2.2" fill="#38bdf8"/>
  <circle cx="49" cy="40" r="2.2" fill="#ffffff"/>
</svg>