<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Poke - Remastered</title>
    <style>
      @font-face {
        font-family: 'Xolonium';
        src: url('./assets/fonts/xolonium-regular.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #0b0f19;
        cursor: url('./assets/images/cursor.png') 0 0, default;
      }

      #game-container {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #0b0f19;
      }

      #game-container:fullscreen,
      #game-container:-webkit-full-screen {
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #0b0f19;
      }

      canvas {
        display: block;
        margin: auto !important;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      canvas:fullscreen,
      canvas:-webkit-full-screen {
        margin: auto !important;
        position: fixed !important;
        top: 0 !important;
        bottom: 0 !important;
        left: 0 !important;
        right: 0 !important;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
